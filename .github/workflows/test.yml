name: Test

# Runs the frontend (vitest) and Rust unit tests on every OS CAMPP ships for.
# Platform-specific code (Unix permissions/symlinks in backups, Windows paths) only
# gets exercised on its own OS, so all three must pass.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'src-tauri/MANUAL.html']
  pull_request:
  workflow_dispatch:
  # Called by build.yml so every release is gated on this exact suite (FR-001)
  workflow_call:

permissions:
  contents: read

concurrency:
  # Inside a workflow_call github.workflow is the caller's name, so a release run never
  # cancels (or is cancelled by) a push run of the same ref.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Keep in sync with build.yml (FR-009)
          node-version: '22'
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        # Pinned to a commit: the toolchain must then be named explicitly
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit -p .

      - name: Frontend tests
        run: npx vitest run

      - name: Rust tests
        working-directory: src-tauri
        # Library + integration tests (tests/*.rs); doc tests were never part of the suite
        run: cargo test --lib --tests
