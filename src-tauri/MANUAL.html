  <h1 id="top">CAMPP User Manual</h1>
  <p><strong>Version 0.3.13</strong> | Local Web Development Stack</p>

  <h2>Contents</h2>
  <ul>
    <li><a href="#overview">Overview</a></li>
    <li><a href="#installation">Installation</a></li>
    <li><a href="#first-run">First Run</a></li>
    <li><a href="#dashboard">Dashboard</a></li>
    <li><a href="#database">Database Connection</a></li>
    <li><a href="#projects">Project Folder</a></li>
    <li><a href="#settings">Settings</a></li>
    <li><a href="#ngrok">Sharing with ngrok</a></li>
    <li><a href="#debug">Debug Page</a></li>
    <li><a href="#troubleshooting">Troubleshooting</a></li>
    <li><a href="#data">Data Locations</a></li>
  </ul>

  <h2 id="overview">Overview</h2>
  <p>CAMPP is a cross-platform local web development stack that bundles everything you need to run PHP websites locally, with no admin rights required:</p>
  <ul>
    <li><strong>Caddy 2.11.7</strong> - Modern web server</li>
    <li><strong>PHP-FPM 8.5</strong> - PHP runtime (8.4, 8.3, 8.2 also available; 7.4 on Windows)</li>
    <li><strong>Database</strong> - MySQL 8.4.11 LTS on Windows/macOS, MariaDB 12.3.3 LTS on Linux</li>
    <li><strong>PostgreSQL 18.6.1</strong> - Optional</li>
    <li><strong>phpMyAdmin 5.2.3</strong> and <strong>Adminer 5.4.2</strong> - Web-based database management (optional)</li>
    <li><strong>ngrok 3.19.2</strong> - Public tunnel to share your site (optional, Windows only)</li>
  </ul>

  <h2 id="installation">Installation</h2>
  <p>Download from <a href="https://github.com/KarnYong/campp/releases/latest">GitHub Releases</a>.</p>

  <h3>Windows</h3>
  <ol>
    <li>Download <code>CAMPP-&lt;version&gt;-x64.exe</code> (recommended) or <code>.msi</code></li>
    <li>Run the installer. No admin rights are needed.</li>
    <li>If Windows SmartScreen shows a warning, click <strong>More info</strong> &rarr; <strong>Run anyway</strong></li>
    <li>Launch CAMPP from the Start Menu or desktop shortcut</li>
  </ol>
  <div class="tip">
    <strong>Portable:</strong> <code>CAMPP-&lt;version&gt;-x64-portable.zip</code> runs without installing. <code>CAMPP-&lt;version&gt;-x64-portable-offline.zip</code> also includes all runtimes, so it works with no internet. Extract either one to a folder you can write to and run <code>CAMPP.exe</code>.
  </div>

  <h3>macOS</h3>
  <ol>
    <li>Download the <code>.dmg</code> file (<code>universal</code> works on Apple Silicon and Intel)</li>
    <li>Open the DMG and drag CAMPP to Applications</li>
    <li>Launch CAMPP from Applications or Launchpad</li>
  </ol>

  <h3>Linux</h3>
  <ul>
    <li><strong>DEB:</strong> <code>sudo apt install ./CAMPP-&lt;version&gt;-amd64.deb</code></li>
    <li><strong>RPM:</strong> <code>sudo dnf install ./CAMPP-&lt;version&gt;-amd64.rpm</code></li>
    <li><strong>AppImage:</strong> <code>chmod +x CAMPP-*.AppImage</code>, then <code>./CAMPP-*.AppImage</code></li>
    <li><strong>Portable:</strong> extract <code>CAMPP-&lt;version&gt;-amd64-portable.tar.gz</code> and run <code>CAMPP/CAMPP</code></li>
  </ul>

  <div class="note">
    <strong>Note:</strong> The Windows SmartScreen warning appears because the app is not code-signed. This is normal, and the source code is public on GitHub. macOS builds are signed and notarized.
  </div>

  <h2 id="first-run">First Run</h2>
  <p>On first launch, the setup wizard guides you through installation:</p>
  <ol>
    <li><strong>Welcome</strong> - Click to begin. If CAMPP finds an existing installation, you can keep it or replace everything.</li>
    <li><strong>Choose components</strong> - Turn optional components on or off and pick a version for each one. Caddy and PHP are required.</li>
    <li><strong>Set root passwords</strong> - Enter a root password for each database you install (MySQL/MariaDB, PostgreSQL). These are required.</li>
    <li><strong>Review installation</strong> - Check your choices and the estimated download size, then click <strong>Install</strong>.</li>
    <li>Wait for download and extraction to finish, then click <strong>Get Started</strong>.</li>
  </ol>
  <div class="warning">
    <strong>Remember your database passwords.</strong> phpMyAdmin, Adminer and your PHP code all use them to connect.
  </div>
  <div class="note">
    <strong>Linux:</strong> If the wizard reports <em>Missing system dependencies</em>, install the packages it lists, then click <strong>Retry Check</strong>.
  </div>

  <h2 id="dashboard">Dashboard</h2>
  <p>The sidebar has <strong>Services</strong>, <strong>Settings</strong>, <strong>Debug</strong> and <strong>User manual</strong>.</p>

  <h3>Services</h3>
  <p>Each installed service shows its status (Running, Stopped or Error), its port, and Start / Stop / Restart controls. Use <strong>Start all</strong> or <strong>Stop all</strong> to control everything at once. If a component isn't installed, its card says <em>Install from Settings</em>.</p>

  <h3>Quick open</h3>
  <ul>
    <li><strong>Website</strong> - Opens <code>http://localhost:8080</code></li>
    <li><strong>phpMyAdmin</strong> - Opens <code>/phpmyadmin</code></li>
    <li><strong>Adminer</strong> - Opens <code>/adminer</code>, a launcher that signs you in to MySQL or PostgreSQL with one click</li>
    <li><strong>Projects folder</strong> - Opens your project folder in the file manager</li>
  </ul>
  <p>Website, phpMyAdmin and Adminer are enabled only while Caddy is running.</p>

  <h3>Default Ports</h3>
  <table>
    <thead>
      <tr><th>Service</th><th>Port</th><th>Access</th></tr>
    </thead>
    <tbody>
      <tr><td>Web Server (Caddy)</td><td>8080</td><td><code>http://localhost:8080</code></td></tr>
      <tr><td>PHP-FPM</td><td>9000</td><td>Internal only (FastCGI)</td></tr>
      <tr><td>MySQL / MariaDB</td><td>3307</td><td><code>127.0.0.1:3307</code></td></tr>
      <tr><td>PostgreSQL</td><td>5433</td><td><code>127.0.0.1:5433</code></td></tr>
      <tr><td>phpMyAdmin</td><td>8080</td><td><code>http://localhost:8080/phpmyadmin</code></td></tr>
      <tr><td>Adminer</td><td>8080</td><td><code>http://localhost:8080/adminer/</code></td></tr>
    </tbody>
  </table>
  <div class="tip">
    <strong>Tip:</strong> These ports are chosen to avoid conflicts with system services, so CAMPP can run alongside an existing MySQL or PostgreSQL. You can change them in Settings.
  </div>

  <h2 id="database">Database Connection</h2>
  <table>
    <thead>
      <tr><th>Setting</th><th>MySQL / MariaDB</th><th>PostgreSQL</th></tr>
    </thead>
    <tbody>
      <tr><td>Host</td><td><code>127.0.0.1</code></td><td><code>127.0.0.1</code></td></tr>
      <tr><td>Port</td><td><code>3307</code></td><td><code>5433</code></td></tr>
      <tr><td>Username</td><td><code>root</code></td><td><code>root</code></td></tr>
      <tr><td>Password</td><td colspan="2">The root password you set in the setup wizard (change it in Settings)</td></tr>
    </tbody>
  </table>

  <h3>PHP Connection Examples</h3>
  <pre><code>&lt;?php
// MySQL / MariaDB
$pdo = new PDO(
    'mysql:host=127.0.0.1;port=3307;charset=utf8mb4',
    'root',
    'your-password'
);

// PostgreSQL
$pg = new PDO(
    'pgsql:host=127.0.0.1;port=5433;dbname=postgres',
    'root',
    'your-password'
);</code></pre>
  <div class="note">
    <strong>Note:</strong> Use <code>127.0.0.1</code> rather than <code>localhost</code> for MySQL. With <code>localhost</code>, PHP tries a Unix socket instead of the TCP port. MySQL (Windows/macOS) and MariaDB (Linux) are compatible and work the same way from PHP.
  </div>

  <h2 id="projects">Project Folder</h2>
  <p>Put your website files in the project folder. To open it, click <strong>Projects folder</strong> under Quick open on the dashboard. Default locations:</p>
  <ul>
    <li><strong>Windows:</strong> <code>&lt;CAMPP install folder&gt;\projects</code> (default install: <code>%LOCALAPPDATA%\CAMPP\projects</code>)</li>
    <li><strong>macOS:</strong> <code>~/Library/Application Support/campp/projects</code></li>
    <li><strong>Linux:</strong> <code>~/.local/share/campp/projects</code></li>
  </ul>

  <h3>Example Project Structure</h3>
  <pre><code>projects/
├── my-site/
│   ├── index.php
│   └── assets/
│       └── style.css
└── another-site/
    └── index.php</code></pre>
  <p>Access your sites at:</p>
  <ul>
    <li><code>http://localhost:8080/my-site/</code></li>
    <li><code>http://localhost:8080/another-site/</code></li>
  </ul>
  <p>When the folder has no <code>index.php</code>, <code>http://localhost:8080</code> shows the CAMPP welcome page.</p>

  <h2 id="settings">Settings</h2>
  <div class="warning">
    <strong>Stop all services before changing settings.</strong> Changes apply the next time services start.
  </div>

  <h3>Appearance</h3>
  <p>Choose the System, Light or Dark theme.</p>

  <h3>Ports</h3>
  <p>Change the Web server, PHP-FPM, Database and PostgreSQL ports.</p>

  <h3>Network</h3>
  <ul>
    <li><strong>127.0.0.1</strong> (default) - Reachable only from this computer</li>
    <li><strong>LAN mode</strong> - Reachable from other devices on your network, e.g. for testing on a phone</li>
  </ul>
  <div class="warning">
    <strong>Warning:</strong> LAN mode exposes your development services to every device on the network. Use it only on trusted, private networks and check your firewall.
  </div>

  <h3>Components</h3>
  <p>Install, reinstall (for example, to switch version) or uninstall each component. At least one component must remain installed. PHP is required by Caddy and phpMyAdmin.</p>

  <h3>Database passwords</h3>
  <p>Change the root password for MySQL/MariaDB and PostgreSQL. The new password takes effect the next time each database starts. Update any PHP code that connects with the old password.</p>

  <h3>ngrok tunnel</h3>
  <p>Paste your ngrok authtoken from <a href="https://ngrok.com/">ngrok.com</a> (Windows only).</p>

  <h2 id="ngrok">Sharing with ngrok (Windows)</h2>
  <ol>
    <li>Install ngrok in the setup wizard or from Settings &rarr; Components</li>
    <li>Create a free account at <a href="https://ngrok.com/">ngrok.com</a> and copy your authtoken</li>
    <li>Start Caddy, then start ngrok. If no authtoken is saved, CAMPP asks for it.</li>
    <li>The public URL appears on the ngrok service card. Anyone with the link can open your site.</li>
  </ol>
  <div class="note">
    <strong>Windows Defender</strong> sometimes quarantines ngrok as a false positive. Settings shows a notice that can add the CAMPP folders to Defender's exclusion list, or lists the manual steps.
  </div>

  <h2 id="debug">Debug Page</h2>
  <p>Open <strong>Debug</strong> in the sidebar (in the setup wizard, press <code>Ctrl+Shift+D</code> or <code>Cmd+Shift+D</code>):</p>
  <ul>
    <li><strong>System</strong> - Version, platform and whether the runtime config loaded</li>
    <li><strong>Folders</strong> - Runtime, resource, downloads and executable paths</li>
    <li><strong>Port check</strong> - Whether each configured port is free for CAMPP to use</li>
    <li><strong>Copy diagnostics</strong> - Copies everything to the clipboard, ready for a bug report</li>
    <li><strong>Reset installation</strong> - Stops every service and deletes all binaries, databases and settings. Your projects folder is kept.</li>
  </ul>

  <h2 id="troubleshooting">Troubleshooting</h2>

  <h3>Service won't start</h3>
  <ul>
    <li>Use <strong>Debug &rarr; Port check</strong> to see if another app is using the port</li>
    <li>Change the port in Settings (stop all services first)</li>
    <li>Check the error on the service card and the files in the logs folder</li>
  </ul>

  <h3>phpMyAdmin or Adminer shows errors</h3>
  <ul>
    <li>Make sure Caddy, PHP-FPM and the database service are all running</li>
    <li>Log in as <code>root</code> with the password you set during setup</li>
  </ul>

  <h3>Reset everything</h3>
  <ol>
    <li>Open <strong>Debug</strong> &rarr; <strong>Reset installation</strong></li>
    <li>Confirm. Every service stops, and binaries, databases and settings are deleted.</li>
    <li>The setup wizard runs again to reinstall</li>
  </ol>
  <div class="warning">
    <strong>Back up your databases first</strong> (for example, export them with phpMyAdmin). A reset deletes all database data.
  </div>

  <h3>Antivirus detects a threat</h3>
  <p>This is a false positive. The source code is open on GitHub, and the Windows build is not code-signed. Add an exception in your antivirus for the CAMPP folder.</p>

  <h2 id="data">Data Locations</h2>
  <p><strong>Windows</strong> keeps everything inside the CAMPP install folder (default <code>%LOCALAPPDATA%\CAMPP</code>, or wherever you extracted the portable zip). <strong>macOS and Linux</strong> use the app data folder: <code>~/Library/Application Support/campp/</code> on macOS, <code>~/.local/share/campp/</code> on Linux.</p>
  <table>
    <thead>
      <tr><th>What</th><th>Windows</th><th>macOS / Linux</th></tr>
    </thead>
    <tbody>
      <tr><td>Runtime binaries</td><td><code>&lt;install&gt;\runtime\</code></td><td><code>campp/runtime/</code></td></tr>
      <tr><td>Projects</td><td><code>&lt;install&gt;\projects\</code></td><td><code>campp/projects/</code></td></tr>
      <tr><td>Configuration</td><td><code>&lt;install&gt;\config\</code></td><td><code>campp/config/</code></td></tr>
      <tr><td>MySQL / MariaDB data</td><td><code>&lt;install&gt;\mysql\data\</code></td><td><code>campp/mysql/data/</code></td></tr>
      <tr><td>PostgreSQL data</td><td><code>&lt;install&gt;\pgsql\data\</code></td><td><code>campp/pgsql/data/</code></td></tr>
      <tr><td>Logs</td><td><code>&lt;install&gt;\logs\</code></td><td><code>campp/logs/</code></td></tr>
    </tbody>
  </table>
  <div class="tip">
    <strong>Tip:</strong> <strong>Debug &rarr; Folders</strong> shows the actual paths on your machine.
  </div>
